# /etc/nginx/sites-available/book.example.com  (alternative to Caddy; get the certificate with certbot)
server {
    listen 80;
    server_name book.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name book.example.com;
    ssl_certificate     /etc/letsencrypt/live/book.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.example.com/privkey.pem;

    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/internal/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Custom domains with nginx: add one server block per customer domain (certbot --nginx -d customer.ru) that proxies
# /api/ to 127.0.0.1:8000 (returning 404 for /api/internal/ and /api/admin/) and / to 127.0.0.1:3000 with
# "proxy_set_header Host $host;". Caddy (deploy/Caddyfile) does this automatically with on-demand TLS, which is why it is recommended.
